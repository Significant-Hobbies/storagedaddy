name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: swift build -c release
      - run: python3 -m unittest test_sparkle_support
        working-directory: scripts

  shared_candidate:
    uses: sass-maker/saas-maker/.github/workflows/daddy-macos-candidate.yml@69af94896a7d56dcaf2be8c5ae30cab0e2bff38f
    with:
      app: storagedaddy
      tooling-ref: 69af94896a7d56dcaf2be8c5ae30cab0e2bff38f
