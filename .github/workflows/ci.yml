name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-daddy-foundation.py --app storagedaddy
      - run: cargo test --locked --manifest-path Vendor/FinderSearch/adapter/Cargo.toml
      - run: python3 scripts/prepare-finder-search.py --build
      - run: swift test
      - run: swift build -c release
      - run: python3 -m unittest test_sparkle_support test_finder_search_support test_swiftpm_resources
        working-directory: scripts

  shared_candidate:
    uses: sass-maker/saas-maker/.github/workflows/daddy-macos-candidate.yml@67dcb59d289c396349244f42778dccbd2953ba41
    with:
      app: storagedaddy
      tooling-ref: 67dcb59d289c396349244f42778dccbd2953ba41

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
