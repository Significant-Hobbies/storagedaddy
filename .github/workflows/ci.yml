name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: swift build -c release
      - run: python3 -m unittest test_sparkle_support
        working-directory: scripts

  shared_candidate:
    uses: sass-maker/saas-maker/.github/workflows/daddy-macos-candidate.yml@de31581b56fa8b6c20a03d0846ad2204aa2c9bab
    with:
      app: storagedaddy
      tooling-ref: de31581b56fa8b6c20a03d0846ad2204aa2c9bab
